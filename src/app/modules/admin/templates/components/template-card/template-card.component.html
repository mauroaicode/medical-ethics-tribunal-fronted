<div
  class="card bg-base-100 shadow-md transition-shadow"
  [class.hover:shadow-lg]="!selectable()"
  [class.cursor-pointer]="selectable()"
  (click)="handleSelect()"
>
  <div class="card-body">
    <!-- Template Icon and Name -->
    <div class="flex items-start gap-3 mb-3">
      <div class="flex-shrink-0">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8 text-info"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="card-title text-base text-info-content line-clamp-2 break-words">
          {{ template().name }}
        </h3>
      </div>
      @if (selectable() && selected()) {
        <div class="flex-shrink-0">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 text-accent"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
      }
    </div>

    <!-- Description -->
    @if (template().description) {
      <p class="text-sm text-base-content/70 line-clamp-2 mb-3">
        {{ template().description }}
      </p>
    }

    <!-- Created At -->
    <div class="text-xs text-base-content/50 mb-4">
      <span class="font-semibold">{{ 'templates.card.createdAt' | transloco }}:</span>
      <span class="ml-1">{{ template().created_at }}</span>
    </div>

    <!-- Actions (only show when not in selectable mode) -->
    @if (!selectable() && template().web_view_link) {
      <div class="card-actions justify-end gap-2">
        <button
          type="button"
          class="btn btn-neutral btn-sm"
          (click)="openTemplateInDocs(template().web_view_link)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
            />
          </svg>
          {{ 'templates.card.viewInDocs' | transloco }}
        </button>
      </div>
    }
  </div>
</div>
