<div class="form-control w-full">
  @if (label()) {
    <label class="label">
      <span class="label-text">{{ label() }}</span>
    </label>
  }

  <div class="relative">
    <!-- Select Button -->
    <button
      type="button"
      class="input input-bordered w-full text-left flex items-center justify-between"
      [class.input-xs]="size() === 'xs'"
      [class.input-sm]="size() === 'sm'"
      [class.input-md]="size() === 'md'"
      [class.input-lg]="size() === 'lg'"
      [class.input-disabled]="disabled() || isDisabled()"
      [disabled]="disabled() || isDisabled()"
      (click)="toggleDropdown()"
      (blur)="onBlur()"
    >
      <span [class.text-base-content/50]="!displayDate()">
        {{ displayDate() || placeholder() }}
      </span>
      <div class="flex items-center gap-2">
        @if (selectedDate() !== null) {
          <button
            type="button"
            class="btn btn-ghost btn-xs btn-circle"
            (click)="clearSelection($event)"
            [attr.aria-label]="'Clear selection'"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-3 w-3"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        }
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4 transition-transform"
          [class.rotate-180]="isOpen()"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </button>

    <!-- Calendar Dropdown -->
    @if (isOpen()) {
      <div class="absolute z-50 w-[320px] mt-1 bg-base-100 border border-base-300 rounded-lg shadow-xl p-4 left-0">
        <!-- Calendar Header -->
        <div class="flex flex-col gap-3 mb-4">
          <!-- Year Navigation -->
          <div class="flex items-center justify-center gap-2">
            <button
              type="button"
              class="btn btn-ghost btn-sm btn-circle"
              (click)="previousYear()"
              aria-label="Previous year"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
                />
              </svg>
            </button>
            <span class="text-base font-bold text-neutral min-w-[80px] text-center">
              {{ currentYear() }}
            </span>
            <button
              type="button"
              class="btn btn-ghost btn-sm btn-circle"
              (click)="nextYear()"
              aria-label="Next year"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 5l7 7-7 7M5 5l7 7-7 7"
                />
              </svg>
            </button>
          </div>

          <!-- Month Navigation -->
          <div class="flex items-center justify-center gap-2">
            <button
              type="button"
              class="btn btn-ghost btn-sm btn-circle"
              (click)="previousMonth()"
              aria-label="Previous month"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
            </button>
            <span class="text-base font-bold text-neutral min-w-[120px] text-center">
              {{ getMonthName(currentMonth()) }}
            </span>
            <button
              type="button"
              class="btn btn-ghost btn-sm btn-circle"
              (click)="nextMonth()"
              aria-label="Next month"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Calendar Days -->
        <div class="grid grid-cols-7 gap-1 mb-2">
          <!-- Day Headers -->
          @for (day of ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb']; track $index) {
            <div class="text-center text-xs font-semibold text-base-content/70 py-2">
              {{ day }}
            </div>
          }
        </div>

        <!-- Calendar Grid -->
        <div class="grid grid-cols-7 gap-1">
          @for (day of getCalendarDays(); track $index) {
            @if (day === null) {
              <div class="aspect-square"></div>
            } @else {
              <button
                type="button"
                class="aspect-square btn btn-sm rounded-md transition-all min-h-[36px] h-full"
                [class.btn-primary]="isSelectedDay(day)"
                [class.btn-ghost]="!isSelectedDay(day)"
                [class.border-2]="isToday(day) && !isSelectedDay(day)"
                [class.border-accent]="isToday(day) && !isSelectedDay(day)"
                [class.text-accent]="isToday(day) && !isSelectedDay(day)"
                [class.font-bold]="isToday(day) || isSelectedDay(day)"
                [class.text-base-content]="!isToday(day) && !isSelectedDay(day)"
                (click)="selectDay(day)"
              >
                {{ day }}
              </button>
            }
          }
        </div>
      </div>
    }
  </div>
</div>
