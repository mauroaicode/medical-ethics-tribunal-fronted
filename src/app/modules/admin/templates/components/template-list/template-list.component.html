<div class="w-full">
  <!-- Search Filter -->
  <div class="mb-6">
    <app-template-search
      [searchValue]="searchValue()"
      (onSearch)="handleSearch($event)"
      (onReset)="handleResetSearch()"
    ></app-template-search>
  </div>

  <!-- Loading State -->
  @if (loading()) {
    <div class="flex justify-center items-center py-12">
      <span class="loading loading-spinner loading-lg text-neutral"></span>
    </div>
  }

  <!-- Templates Grid -->
  @if (!loading()) {
    @if (templates().length === 0) {
      <div class="card bg-base-100 shadow-sm">
        <div class="card-body text-center py-12">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-16 w-16 mx-auto text-base-content/30 mb-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <p class="text-base-content/70 text-lg">{{ 'templates.empty' | transloco }}</p>
        </div>
      </div>
    }
    @if (templates().length > 0) {
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        @for (template of templates(); track template.id) {
          <app-template-card
            [template]="template"
            (onViewInDocs)="handleViewInDocs($event)"
          ></app-template-card>
        }
      </div>
    }
  }
</div>
